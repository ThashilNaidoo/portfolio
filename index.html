    <script>
      // Apply the saved theme (light by default) before first paint.
      ;(function () {
        var saved
        try {
          saved = localStorage.getItem('theme')
        } catch (e) {}
        document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
